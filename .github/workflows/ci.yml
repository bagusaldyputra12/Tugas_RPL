# Simpan sebagai: .github/workflows/ci.yml
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Tahap 2: Checkout repository
      - uses: actions/checkout@v6

      # Siapkan runtime Node.js
      - uses: actions/setup-node@v7
        with:
          node-version: '20.x'
          cache: 'npm'

      # Tahap 3: Install dependensi (mengikuti package-lock.json)
      - name: Install dependensi
        run: npm ci

      # Tahap 4: Build / Lint (dilewati otomatis bila script tidak ada)
      - name: Build
        run: npm run build --if-present
      - name: Lint
        run: npm run lint --if-present

      # Tahap 5: Automated test
      - name: Test
        run: npm test 